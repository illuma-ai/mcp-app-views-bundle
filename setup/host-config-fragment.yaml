mcpSettings:
  apps: true
  appsHonorToolApproval: true
  allowedAddresses:
    - localhost:8230
    - localhost:3000
    - localhost:3001
mcpAppSandbox:
  url: http://localhost:3080/api/mcp/sandbox
  maxPersistedAppBytes: 4194304
mcpServers:
  m365:
    title: Microsoft 365
    description: >-
      Outlook mail, calendar and Teams for the signed-in user through Microsoft Graph. Reads run directly; sending,
      moving and deleting ask for approval.
    type: streamable-http
    url: http://localhost:3000/mcp
    requiresOAuth: true
    timeout: 120000
  ado:
    title: Azure DevOps
    description: >-
      Boards, work items, sprints, repos, pipelines and test plans in the gaavi organization (project Dev). Reads run
      directly; creating and updating ask for approval.
    type: streamable-http
    url: http://localhost:3001/mcp
    requiresOAuth: true
    timeout: 120000
